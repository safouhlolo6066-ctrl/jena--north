<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<title>جينا الشمالية (معاينة)</title>
<meta name="theme-color" content="#0B2447">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{--ink:#12305E;--mute:#4A6488;--line:#DCE6F1;--bg:#F3F7FB;--card:#FFFFFF;--sky-1:#6BB8E8;--sky-2:#3D95D6;--sky-3:#2B80C4;
--red:#EC1C24;--red-d:#C81526;--accent:#2B80C4;--accent-soft:#EAF2FA;--chip:#EAF2FA;
--ok:#1F8A4C;--ok-soft:#E3F4EA;--warn:#B7791F;--warn-soft:#FCF1DC;--bad:#C81526;--bad-soft:#FDE8E9;
--shadow:0 1px 2px rgba(18,48,94,.06),0 4px 14px rgba(18,48,94,.06);
--display:'Alexandria','IBM Plex Sans Arabic',Tahoma,sans-serif;--body:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root{--ink:#E4EDF8;--mute:#9DB2CC;--line:#26374F;--bg:#0D1726;--card:#13213A;--sky-1:#1E4E7E;--sky-2:#1A4170;--sky-3:#163760;--accent:#6BB8E8;--accent-soft:#1B2D4A;--chip:#1B2D4A;--ok:#5FC48E;--ok-soft:#123222;--warn:#E3B659;--warn-soft:#352812;--bad:#F08A7E;--bad-soft:#3A1418;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.55;margin:0}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--sky-2);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--card)}
header{position:relative;background:linear-gradient(170deg,var(--sky-1) 0%,var(--sky-2) 55%,var(--sky-3) 100%);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 18px 50px}
header .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
header img{height:36px;width:auto;filter:drop-shadow(0 3px 8px rgba(0,0,0,.25))}
header .pill{font-size:12px;background:rgba(255,255,255,.22);padding:5px 11px;border-radius:999px}
header h2{font-family:var(--display);font-weight:700;font-size:20px;margin:10px 0 0;color:#fff}
header .sub{font-size:13px;color:#EAF6FF}
header svg{position:absolute;left:0;bottom:-1px;width:100%;height:44px}header svg path{fill:var(--card)}
main{flex:1;padding:0 16px 96px;display:grid;gap:12px;align-content:start}
h2{font-family:var(--display);font-size:15px;font-weight:700;margin:0}
h3{font-size:13px;margin:0;color:var(--mute);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:10px;min-width:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}.row>*{min-width:0}
.mute{color:var(--mute);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--chip);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--sky-2);border-radius:5px;transition:width .25s}
.chip{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--chip);color:var(--mute);white-space:nowrap;border:0}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.acc{background:var(--chip);color:var(--sky-3)}
.list{display:grid;gap:8px}
.item{width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:var(--shadow)}
.item b{display:block;font-weight:600}
.btn{border:0;background:var(--red);color:#fff;font-weight:700;padding:12px 14px;border-radius:12px;width:100%}.btn:hover{background:var(--red-d)}
.btn.ghost{background:var(--chip);color:var(--ink)}.btn.bad{background:var(--red-d)}.btn:disabled{opacity:.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.opt{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 6px;font-weight:600;text-align:center}
.opt[aria-pressed="true"]{background:var(--sky-3);color:#fff;border-color:var(--sky-3)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.tile b{display:block;font-family:var(--display);font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}.tile span{font-size:12px;color:var(--mute)}
nav{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:4px 10px calc(4px + env(safe-area-inset-bottom,0px))}
nav .in{max-width:480px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
nav button{border:0;background:none;padding:9px 4px;border-radius:10px;color:var(--mute);font-weight:600;font-size:13px}
nav button[aria-current="page"]{color:var(--sky-3);font-weight:700;background:var(--chip)}
.sheet-bg{position:fixed;inset:0;background:rgba(10,27,51,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
#toast{position:fixed;inset:auto 16px calc(80px + env(safe-area-inset-bottom,0px)) 16px;z-index:60;background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:12px;text-align:center;max-width:448px;margin:0 auto}
.item .mute{display:block}
.tier{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px}
.t-A{background:#1F8A4C}.t-B{background:#D9A400}.t-C{background:#9DB3D6}.t-Z{background:#1B1B1B}
.day{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 2px;font-weight:600;text-align:center;font-size:12.5px}
.day[aria-pressed="true"]{background:var(--sky-3);color:#fff;border-color:var(--sky-3)}.day.today{box-shadow:0 0 0 2px var(--red) inset}
.area{font-family:var(--display);font-weight:700;font-size:13.5px;color:var(--sky-3);margin-top:6px}
.msg{padding:28px 18px;text-align:center;display:grid;gap:10px;justify-items:center}
.sk{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
</style>
</head>
<body>
<div class="app" dir="rtl" lang="ar">
  <header><div class="row"><img src="logo.png" alt="جينا"><span class="pill" id="who"></span></div><h2 id="ttl">جينا الشمالية</h2><svg viewBox="0 0 390 44" preserveAspectRatio="none" aria-hidden="true"><path d="M0 24 C 40 6, 70 40, 112 22 C 150 6, 168 32, 205 20 C 250 4, 280 36, 322 20 C 352 10, 372 14, 390 12 L 390 44 L 0 44 Z"/></svg></header>
  <main id="view"></main>
  <nav><div class="in" id="nav"></div></nav>
</div>
<div id="sheet-root"></div>
<div id="toast" hidden></div>
<script>
(function () {
  "use strict";
  var SB_URL = "https://bohqhtwpwmjgncfokssu.supabase.co";
  var SB_KEY = "sb_publishable_aqnwKrAqpTADZQO3Tl8NNQ_6-0Vcoqx";
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var money = function (n) { return "$" + Math.round(Number(n) || 0).toLocaleString("en-US"); };
  var DAYS = ["السبت", "الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس"];
  var WD = { Saturday: "السبت", Sunday: "الأحد", Monday: "الاثنين", Tuesday: "الثلاثاء", Wednesday: "الأربعاء", Thursday: "الخميس", Friday: "" };
  var ROLE_AR = { rep: "مندوب مفرق", rep_wholesale: "مندوب جملة", rep_key: "مندوب كبار عملاء", rep_cover: "مندوب تغطية", sup_retail: "مشرف", sup_wholesale: "مشرف جملة", sup_key: "مشرف كبار عملاء", admin: "مدير", gm: "مدير عام", sales_manager: "مدير مبيعات", area_manager: "مدير منطقة" };
  var REASONS = ["المحل مغلق", "صاحب المحل غير موجود", "رفض الزيارة", "سبب آخر"];
  var TIER = { A: "A", B: "B", C: "C", Z: "Z" };
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

  var sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, storageKey: "north-auth", autoRefreshToken: true } });
  var S = { me: null, tab: "", line: [], lineOwner: null, week: 1, day: "", team: [], sup: null, sheet: null, busy: false, err: "" };
  try { S.week = Number(localStorage.getItem("north-week")) || 1; } catch (e) {}

  function todayName() {
    var n = new Intl.DateTimeFormat("en-US", { weekday: "long", timeZone: "Asia/Damascus" }).format(new Date());
    return WD[n] || "";
  }
  function toast(t) { var e = $("#toast"); e.textContent = t; e.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { e.hidden = true; }, 2400); }
  function isRep(r) { return /^rep/.test(r || ""); }
  function uuid() { return (crypto.randomUUID ? crypto.randomUUID() : "v" + Date.now() + Math.random().toString(16).slice(2)); }

  /* ---------- login ---------- */
  function msg(title, body, retry) {
    $("#view").innerHTML = '<div class="card msg"><h2>' + esc(title) + '</h2><div class="mute">' + esc(body) + "</div>" + (retry ? '<button type="button" class="btn" data-a="retry">إعادة المحاولة</button>' : "") + "</div>";
    $("#nav").innerHTML = "";
  }
  async function login() {
    var s = (await sb.auth.getSession()).data.session;
    if (s) {
      var chk = await sb.auth.getUser();
      if (!chk.error && chk.data && chk.data.user) return true;
      try { await sb.auth.signOut(); } catch (e) {}
    }
    var init = tg && tg.initData;
    if (!init) { msg("افتح التطبيق من البوت", "هذا التطبيق يعمل من داخل تلغرام: افتح @Jenanorth_bot واضغط زر التطبيق."); return false; }
    var r, j;
    try {
      r = await fetch(SB_URL + "/functions/v1/north-auth", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ initData: init }) });
      j = await r.json();
    } catch (e) { msg("لا يوجد اتصال", "تأكد من الإنترنت ثم أعد المحاولة.", true); return false; }
    if (!j.ok) {
      var m = { not_linked: ["حسابك غير مربوط بعد", "أرسل رسالة للبوت ليصل طلبك للإدارة، وبعد الموافقة يفتح التطبيق."], not_active: ["حسابك بانتظار التفعيل", "الإدارة لم تفعّل حسابك بعد."], expired: ["انتهت الجلسة", "أغلق التطبيق وافتحه من البوت من جديد."], bad_signature: ["تعذر التحقق", "افتح التطبيق من داخل بوت الشمالية."] }[j.err] || ["تعذر الدخول", "حاول مرة أخرى (" + (j.err || "؟") + (j.detail ? ": " + j.detail : "") + ")."];
      msg(m[0], m[1], j.err === "server" || j.err === "link_failed"); return false;
    }
    var o = await sb.auth.verifyOtp({ token_hash: j.token_hash, type: "magiclink" });
    if (o.error) { msg("تعذر الدخول", o.error.message, true); return false; }
    return true;
  }

  /* ---------- data ---------- */
  function norm(rows, staff) {
    return rows.map(function (x) {
      if (staff) return { id: x.customer_id, name: x.customers && x.customers.name, area: x.customers && x.customers.area, day: x.visit_day, tier: x.tier, target: x.target_usd, avg: x.avg_monthly_usd, flag: x.flag, res: x.res || null, reason: x.reason || null };
      return { id: x.customer_id, name: x.name, area: x.area, day: x.visit_day, tier: x.tier, target: x.target_usd, avg: x.avg_monthly_usd, flag: x.flag, res: x.today_result, reason: x.today_reason };
    });
  }
  async function loadMyLine() {
    var r = await sb.rpc("app_my_line");
    if (r.error) throw r.error;
    S.line = norm(r.data || [], false); S.lineOwner = null;
  }
  async function loadRepLine(t) {
    var r = await sb.from("customer_targets").select("customer_id,visit_day,tier,target_usd,avg_monthly_usd,flag,customers(name,area)").eq("roster_id", t.roster_id).limit(1000);
    if (r.error) throw r.error;
    var rows = r.data || [], map = {};
    if (t.rep_id) {
      var d = new Date(Date.now() - 6 * 3600e3).toISOString().slice(0, 10);
      var v = await sb.from("visits").select("customer_id,result,reason,created_at").eq("rep_id", t.rep_id).gte("created_at", d).order("created_at");
      (v.data || []).forEach(function (x) { map[x.customer_id] = x; });
    }
    rows.forEach(function (x) { var m = map[x.customer_id]; if (m) { x.res = m.result; x.reason = m.reason; } });
    S.line = norm(rows, true); S.lineOwner = t;
  }
  async function loadTeam() {
    var r = await sb.rpc("app_team_today");
    if (r.error) throw r.error;
    S.team = r.data || [];
  }

  async function loadSup() {
    var a = await sb.rpc("app_sup_today"), b = await sb.rpc("app_sup_audits", { p_days: 7 });
    if (a.error) throw a.error;
    S.sup = { today: a.data || [], audits: b.data || [] };
  }

  /* ---------- queue (offline-safe visit saving) ---------- */
  function qget() { try { return JSON.parse(localStorage.getItem("north-q") || "[]"); } catch (e) { return []; } }
  function qset(a) { try { localStorage.setItem("north-q", JSON.stringify(a)); } catch (e) {} }
  async function sendVisit(p) {
    var r = await sb.rpc("app_record_visit", p);
    if (r.error) { if (/not allowed|not in your line|bad result/.test(r.error.message)) return "reject"; return "retry"; }
    return "ok";
  }
  async function flush() {
    var q = qget(), keep = [];
    for (var i = 0; i < q.length; i++) { var s = await sendVisit(q[i]); if (s === "retry") keep.push(q[i]); }
    qset(keep);
    return keep.length;
  }

  /* ---------- views ---------- */
  function dayKey(d, w) { return d + "-" + w; }
  function lineView() {
    var rows = S.line, tn = todayName();
    if (!S.day) S.day = tn || DAYS[0];
    var h = "";
    if (S.lineOwner) h += '<div class="card"><div class="row"><h2>خط ' + esc(S.lineOwner.name) + '</h2><button type="button" class="chip acc" data-a="backteam">رجوع</button></div></div>';
    h += '<div class="grid2"><button type="button" class="opt" data-a="week" data-v="1" aria-pressed="' + (S.week === 1) + '">الأسبوع 1</button><button type="button" class="opt" data-a="week" data-v="2" aria-pressed="' + (S.week === 2) + '">الأسبوع 2</button></div>';
    h += '<div class="grid6">';
    DAYS.forEach(function (d) {
      var n = rows.filter(function (x) { return x.day === dayKey(d, S.week); }).length;
      h += '<button type="button" class="day' + (d === tn ? " today" : "") + '" data-a="day" data-v="' + d + '" aria-pressed="' + (S.day === d) + '">' + d.replace("الأ", "الأ") + '<br><span class="num mute" style="font-size:11px">' + n + "</span></button>";
    });
    h += "</div>";
    var cur = rows.filter(function (x) { return x.day === dayKey(S.day, S.week); });
    var done = cur.filter(function (x) { return x.res === "visited"; }).length, miss = cur.filter(function (x) { return x.res === "nosale"; }).length;
    var sum = cur.reduce(function (a, x) { return a + Number(x.target || 0); }, 0);
    h += '<div class="card"><div class="row"><h2>' + esc(S.day) + " · أسبوع " + S.week + '</h2><span class="chip acc num">' + cur.length + ' محل</span></div>' +
      '<div class="bar"><i style="width:' + (cur.length ? Math.round((done + miss) / cur.length * 100) : 0) + '%"></i></div>' +
      '<div class="mute num">تمت ' + done + " · لم تتم " + miss + " · هدف المحلات " + money(sum) + " شهرياً</div></div>";
    if (!cur.length) return h + '<div class="card"><span class="mute">لا توجد محلات في هذا اليوم.</span></div>';
    var byArea = {};
    cur.forEach(function (x) { (byArea[x.area || "بدون منطقة"] = byArea[x.area || "بدون منطقة"] || []).push(x); });
    Object.keys(byArea).sort().forEach(function (a) {
      h += '<div class="area">' + esc(a) + ' <span class="mute num">(' + byArea[a].length + ")</span></div><div class=\"list\">";
      byArea[a].forEach(function (x) {
        var st = x.res === "visited" ? '<span class="chip ok">تمت</span>' : x.res === "nosale" ? '<span class="chip warn">' + esc(x.reason || "لم تتم") + "</span>" : "";
        h += '<button type="button" class="item" data-a="shop" data-v="' + x.id + '"><span><b><i class="tier t-' + (TIER[x.tier] || "C") + '"></i>' + esc(x.name) + '</b><span class="mute num">هدف ' + money(x.target) + " · متوسط " + money(x.avg) + "</span></span>" + st + "</button>";
      });
      h += "</div>";
    });
    return h;
  }
  function goalsView() {
    var rows = S.line, total = 0, avg = 0, byTier = { A: 0, B: 0, C: 0, Z: 0 }, byDay = {};
    rows.forEach(function (x) { total += Number(x.target || 0); avg += Number(x.avg || 0); byTier[x.tier] = (byTier[x.tier] || 0) + 1; byDay[x.day] = (byDay[x.day] || 0) + Number(x.target || 0); });
    var h = '<div class="card"><h2>هدفي الشهري</h2><div class="tiles"><div class="tile"><b>' + money(total) + "</b><span>الهدف</span></div><div class=\"tile\"><b>" + money(avg) + "</b><span>المتوسط الحالي</span></div><div class=\"tile\"><b>" + rows.length + "</b><span>محل</span></div></div>" +
      '<div class="mute">النمو المطلوب +20% عن متوسط الأشهر الماضية. A كبار · B متوسط · C صغار · Z بدون مبيعات.</div></div>';
    h += '<div class="card"><h3>توزيع المحلات</h3><div class="grid3"><div class="tile"><b>' + (byTier.A || 0) + "</b><span>A</span></div><div class=\"tile\"><b>" + (byTier.B || 0) + "</b><span>B</span></div><div class=\"tile\"><b>" + ((byTier.C || 0) + (byTier.Z || 0)) + "</b><span>C/صفر</span></div></div></div>";
    var keys = Object.keys(byDay).sort();
    if (keys.length) {
      var mx = Math.max.apply(null, keys.map(function (k) { return byDay[k]; })) || 1;
      h += '<div class="card"><h3>هدف كل يوم من الخط</h3>';
      keys.forEach(function (k) { h += '<div class="row"><span>' + esc(k) + '</span><span class="num mute">' + money(byDay[k]) + '</span></div><div class="bar"><i style="width:' + Math.round(byDay[k] / mx * 100) + '%"></i></div>'; });
      h += "</div>";
    }
    return h;
  }
  function teamView() {
    var T = S.team, act = T.filter(function (t) { return t.active; }).length, vis = 0, ns = 0;
    T.forEach(function (t) { vis += t.visited; ns += t.nosale; });
    var h = '<div class="tiles"><div class="tile"><b>' + act + "/" + T.length + "</b><span>مفعّلون</span></div><div class=\"tile\"><b>" + vis + "</b><span>زيارات اليوم</span></div><div class=\"tile\"><b>" + ns + "</b><span>لم تتم</span></div></div><div class=\"list\">";
    T.forEach(function (t, i) {
      var chip = !t.active ? '<span class="chip warn">غير مفعّل</span>' : t.eval_level ? '<span class="chip ' + (t.eval_total >= 70 ? "ok" : "warn") + ' num">' + Math.round(t.eval_total) + "</span>" : "";
      var last = t.last_at ? new Date(t.last_at).toLocaleTimeString("ar", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Damascus" }) : "—";
      h += '<button type="button" class="item" data-a="rep" data-v="' + i + '"><span><b>' + esc(t.name) + '</b><span class="mute num">' + esc(t.channel || "") + " · " + t.shops + " محل · هدف " + money(t.target_month) + '</span><span class="mute num">اليوم: ' + t.visited + " زيارة · آخر نشاط " + last + "</span></span>" + chip + "</button>";
    });
    return h + "</div>";
  }

  function supView() {
    var X = S.sup || { today: [], audits: [] }, T = X.today, ca = 0, cd = 0, au = 0;
    T.forEach(function (t) { ca += t.calls_total; cd += t.calls_done; au += t.audits; });
    var h = '<div class="tiles"><div class="tile"><b>' + cd + "/" + ca + "</b><span>اتصالات اليوم</span></div><div class=\"tile\"><b>" + au + "</b><span>زيارات تدقيق</span></div><div class=\"tile\"><b>" + T.length + "</b><span>مشرفون</span></div></div>";
    if (!T.length) h += '<div class="card"><span class="mute">لا يوجد مشرفون مفعّلون بعد. يظهر المشرف هنا بعد تفعيله من البوت.</span></div>';
    h += '<div class="list">';
    T.forEach(function (t) {
      var last = t.last_at ? new Date(t.last_at).toLocaleTimeString("ar", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Damascus" }) : "—";
      h += '<div class="item"><span><b>' + esc(t.name) + '</b><span class="mute num">اتصالات ' + t.calls_done + "/" + t.calls_total + " · تم " + t.calls_ok + " · لم يرد " + t.calls_noans + (t.calls_fake ? " · وهمية " + t.calls_fake : "") + '</span><span class="mute num">تدقيق ' + t.audits + (t.avg_score != null ? " · متوسط " + t.avg_score + "/10" : "") + " · آخر نشاط " + last + "</span></span>" + (t.calls_fake ? '<span class="chip bad">وهمية</span>' : "") + "</div>";
    });
    h += "</div>";
    if (X.audits.length) {
      h += '<h3>آخر زيارات التدقيق (7 أيام)</h3><div class="list">';
      X.audits.forEach(function (a) {
        var d = new Date(a.created_at).toLocaleString("ar", { day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit", timeZone: "Asia/Damascus" });
        h += '<div class="item"><span><b>' + esc(a.store || "محل غير مسجّل") + '</b><span class="mute">' + esc(a.sup_name || "") + (a.rep_name ? " · مندوب " + esc(a.rep_name) : "") + " · " + d + "</span>" + (a.note ? '<span class="mute">' + esc(a.note) + "</span>" : "") + '</span><span class="chip ' + (a.score >= 7 ? "ok" : a.score >= 4 ? "warn" : "bad") + ' num">' + (a.score != null ? a.score : "—") + "</span></div>";
      });
      h += "</div>";
    }
    return h;
  }

  function sheetHtml() {
    var sh = S.sheet; if (!sh) return "";
    var x = S.line.filter(function (r) { return r.id === sh.id; })[0]; if (!x) return "";
    var h = '<div class="sheet-bg" data-a="closebg"><div class="sheet" role="dialog" aria-label="محل"><div class="row"><div><h2>' + esc(x.name) + '</h2><div class="mute">' + esc(x.area) + " · " + esc(x.day) + '</div></div><button type="button" class="chip" data-a="close">إغلاق</button></div>';
    if (sh.step === "info") {
      h += '<div class="tiles"><div class="tile"><b>' + money(x.target) + "</b><span>هدف شهري</span></div><div class=\"tile\"><b>" + money(x.avg) + "</b><span>متوسط</span></div><div class=\"tile\"><b>" + esc(x.tier || "—") + "</b><span>فئة</span></div></div>";
      if (x.flag) h += '<div class="step"><span class="mute">ملاحظة</span><span class="chip warn">' + esc(x.flag) + "</span></div>";
      h += "<h3>هدف كل صنف</h3>";
      if (sh.skus == null) h += '<div class="mute">جاري التحميل…</div>';
      else if (!sh.skus.length) h += '<div class="mute">لا أصناف مستهدفة.</div>';
      else sh.skus.forEach(function (k) { h += '<div class="sk"><span>' + esc(k.name) + '</span><span class="num">' + money(k.target_usd) + "</span></div>"; });
      if (isRep(S.me.role) && !S.lineOwner) {
        if (x.res) h += '<div class="step"><span>سُجّلت زيارة اليوم</span><span class="chip ok">' + (x.res === "visited" ? "تمت" : "لم تتم") + "</span></div>";
        else h += '<button type="button" class="btn" data-a="startvisit">تسجيل زيارة</button>';
      }
    } else if (sh.step === "result") {
      h += '<div class="step"><span class="mute">الموقع</span><span class="chip ' + (sh.geo ? "ok" : "warn") + '">' + (sh.geo ? "تم الالتقاط · دقة " + sh.acc + " م" : sh.geoMsg || "جاري تحديد الموقع…") + "</span></div>" +
        '<div class="grid2"><button type="button" class="opt" data-a="visited">تمت الزيارة</button><button type="button" class="opt" data-a="nosale">لم تتم</button></div>';
    } else if (sh.step === "reason") {
      h += "<h3>السبب</h3><div class=\"list\">";
      REASONS.forEach(function (r) { h += '<button type="button" class="opt" data-a="reason" data-v="' + esc(r) + '">' + esc(r) + "</button>"; });
      h += "</div>";
    }
    return h + "</div></div>";
  }

  /* ---------- shell ---------- */
  function tabs() {
    return isRep(S.me.role) ? [["line", "خطي"], ["goals", "أهدافي"]] : [["team", "الفريق"], ["sup", "المشرفون"], ["line", "خط مندوب"]];
  }
  function render() {
    $("#who").textContent = S.me.name + " · " + (ROLE_AR[S.me.role] || S.me.role);
    var TT = { line: S.lineOwner ? "خط " + S.lineOwner.name : "خطي", goals: "أهدافي", team: "الفريق", sup: "المشرفون" }; $("#ttl").textContent = TT[S.tab] || "جينا الشمالية";
    var tb = tabs();
    $("#nav").innerHTML = tb.map(function (t) { return '<button type="button" data-a="tab" data-v="' + t[0] + '"' + (S.tab === t[0] ? ' aria-current="page"' : "") + ">" + t[1] + "</button>"; }).join("");
    var v;
    if (S.tab === "team") v = teamView();
    else if (S.tab === "sup") v = supView();
    else if (S.tab === "goals") v = goalsView();
    else if (!isRep(S.me.role) && !S.lineOwner) v = '<div class="card"><span class="mute">اختر مندوباً من تبويب «الفريق» لعرض خطه وأهدافه.</span></div>';
    else if (!S.line.length) v = '<div class="card msg"><b>لا يوجد خط مرتبط بحسابك</b><span class="mute">إن كان هذا خطأ، أخبر الإدارة.</span></div>';
    else v = lineView();
    if (S.err) v = '<div class="card"><span class="chip bad">' + esc(S.err) + "</span></div>" + v;
    $("#view").innerHTML = v;
    $("#sheet-root").innerHTML = sheetHtml();
  }

  /* ---------- actions ---------- */
  function getGeo(sh) {
    if (!navigator.geolocation) { sh.geoMsg = "الموقع غير متاح"; render(); return; }
    navigator.geolocation.getCurrentPosition(function (p) { sh.geo = { lat: p.coords.latitude, lng: p.coords.longitude }; sh.acc = Math.round(p.coords.accuracy); render(); },
      function () { sh.geoMsg = "تعذر الموقع (تُسجَّل الزيارة بدونه)"; render(); }, { enableHighAccuracy: true, timeout: 9000, maximumAge: 20000 });
  }
  async function save(result, reason) {
    var sh = S.sheet, p = { p_client_id: uuid(), p_customer: sh.id, p_result: result, p_reason: reason || "", p_lat: sh.geo ? sh.geo.lat : null, p_lng: sh.geo ? sh.geo.lng : null, p_acc: sh.acc || null };
    var st = await sendVisit(p), x = S.line.filter(function (r) { return r.id === sh.id; })[0];
    if (st === "reject") { toast("لا يمكن تسجيل هذه الزيارة"); S.sheet = null; render(); return; }
    if (st === "retry") { var q = qget(); q.push(p); qset(q); toast("حُفظت على الجهاز وستُرسل عند عودة الاتصال"); } else toast("تم تسجيل الزيارة");
    if (x) { x.res = result; x.reason = reason || null; }
    S.sheet = null; render();
  }
  document.addEventListener("click", async function (e) {
    var b = e.target.closest("[data-a]"); if (!b) return;
    var a = b.getAttribute("data-a"), v = b.getAttribute("data-v");
    if (a === "closebg") { if (e.target !== b) return; S.sheet = null; render(); return; }
    if (a === "close") { S.sheet = null; render(); return; }
    if (a === "retry") { location.reload(); return; }
    if (a === "tab") { S.tab = v; S.err = ""; if (v === "sup") { try { await loadSup(); } catch (er) { S.err = "تعذر تحميل المشرفين"; } } if (v === "line" && !isRep(S.me.role)) { S.lineOwner = null; } render(); return; }
    if (a === "week") { S.week = Number(v); try { localStorage.setItem("north-week", v); } catch (x) {} render(); return; }
    if (a === "day") { S.day = v; render(); return; }
    if (a === "backteam") { S.tab = "team"; S.lineOwner = null; render(); return; }
    if (a === "rep") {
      var t = S.team[Number(v)];
      if (!t.shops) { toast("لا خط لهذا المندوب"); return; }
      try { S.err = ""; await loadRepLine(t); S.tab = "line"; S.day = ""; } catch (er) { S.err = "تعذر تحميل الخط"; }
      render(); return;
    }
    if (a === "shop") {
      S.sheet = { id: v, step: "info", skus: null }; render();
      var r = await sb.rpc("app_shop_skus", { p_customer: v });
      if (S.sheet && S.sheet.id === v) { S.sheet.skus = r.error ? [] : r.data; render(); }
      return;
    }
    if (a === "startvisit") { S.sheet.step = "result"; render(); getGeo(S.sheet); return; }
    if (a === "visited") { await save("visited", ""); return; }
    if (a === "nosale") { S.sheet.step = "reason"; render(); return; }
    if (a === "reason") { await save("nosale", v); return; }
  });

  /* ---------- start ---------- */
  (async function () {
    msg("جاري الدخول…", "لحظة من فضلك");
    try {
      if (!(await login())) return;
      var u = (await sb.auth.getUser()).data.user;
      var p = await sb.from("profiles").select("id,name,role,status").eq("id", u.id).maybeSingle();
      if (!p.data || p.data.status !== "active") { msg("حسابك غير مفعّل", "تواصل مع الإدارة.", true); return; }
      S.me = p.data;
      if (isRep(S.me.role)) { S.tab = "line"; await loadMyLine(); flush(); }
      else { S.tab = "team"; await loadTeam(); }
      render();
    } catch (er) { msg("حدث خطأ", String(er && er.message || er), true); }
  })();
  document.addEventListener("visibilitychange", async function () {
    if (document.visibilityState !== "visible" || !S.me) return;
    try { var u = await sb.auth.getUser(); if (u.error) { location.reload(); return; } if (!isRep(S.me.role)) { if (S.tab === "team") { await loadTeam(); } else if (S.tab === "sup") { await loadSup(); } render(); } } catch (e) {}
  });
  window.addEventListener("online", function () { if (S.me) flush(); });
})();

</script>
</body>
</html>
