<head>

<title>ميني اب الشمالية</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-sized column. Header with role switch, scrolling view, bottom tab bar. Two roles share one demo state so a rep's visit shows up in the supervisor summary. */
:root {
  --bg: #EEF3F4;
  --card: #FFFFFF;
  --ink: #14262B;
  --mute: #5B6F75;
  --line: #D8E3E5;
  --accent: #0B7A86;
  --accent-ink: #FFFFFF;
  --accent-soft: #D7EEF0;
  --ok: #2C7A52;
  --ok-soft: #DCF0E4;
  --warn: #9A6A12;
  --warn-soft: #F8EACB;
  --bad: #B5382C;
  --bad-soft: #F8DDD9;
  --display: "Cairo", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --body: "IBM Plex Sans Arabic", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1A1D; --card: #162428; --ink: #E6F0F1; --mute: #92A8AD; --line: #27393E;
    --accent: #3CB6C2; --accent-ink: #06171A; --accent-soft: #15383D;
    --ok: #5FC48E; --ok-soft: #173326; --warn: #E3B659; --warn-soft: #3A2E12; --bad: #F08A7E; --bad-soft: #3D1D19;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1A1D; --card: #162428; --ink: #E6F0F1; --mute: #92A8AD; --line: #27393E;
  --accent: #3CB6C2; --accent-ink: #06171A; --accent-soft: #15383D;
  --ok: #5FC48E; --ok-soft: #173326; --warn: #E3B659; --warn-soft: #3A2E12; --bad: #F08A7E; --bad-soft: #3D1D19;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--card); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 520px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--card); border-bottom: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 8px; }
.brand { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.brand h1 { font-family: var(--display); font-weight: 800; font-size: 18px; margin: 0; }
.brand small { color: var(--mute); font-size: 12px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--bg); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; padding: 8px 10px; border-radius: 8px; font-weight: 600; color: var(--mute); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.demo-note { font-size: 12px; color: var(--warn); background: var(--warn-soft); border-radius: 8px; padding: 5px 10px; }
main { flex: 1; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 96px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 12px; align-content: start; }
h2 { font-family: var(--display); font-size: 17px; font-weight: 800; margin: 0; }
h3 { font-size: 14px; margin: 0; color: var(--mute); font-weight: 600; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }
.row > * { min-width: 0; }
.mute { color: var(--mute); font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--bg); border-radius: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 6px; transition: width .25s; }
.chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 20px; background: var(--bg); color: var(--mute); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.acc { background: var(--accent-soft); color: var(--accent); }
.list { display: grid; gap: 8px; }
.item { width: 100%; text-align: right; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.item b { display: block; }
.item:disabled { opacity: .75; cursor: default; }
.btn { border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; padding: 12px 14px; border-radius: 10px; width: 100%; }
.btn.ghost { background: var(--accent-soft); color: var(--accent); }
.btn.bad { background: var(--bad); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.grid6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.opt { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 11px 6px; font-weight: 600; text-align: center; }
.opt[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
.tile b { display: block; font-family: var(--display); font-size: 20px; font-variant-numeric: tabular-nums; }
.tile span { font-size: 12px; color: var(--mute); }
nav { position: fixed; inset: auto 0 0 0; z-index: 20; background: var(--card); border-top: 1px solid var(--line);
  padding: 6px max(10px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px)); }
nav .in { max-width: 520px; margin: 0 auto; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
nav button { border: 0; background: transparent; padding: 9px 4px; border-radius: 10px; color: var(--mute); font-weight: 600; font-size: 13px; }
nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.sheet-bg { position: fixed; inset: 0; background: rgba(8, 20, 24, .55); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 520px; max-height: 88%; overflow: auto; border-radius: 18px 18px 0 0; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 12px; }
.step { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
.qty { display: flex; align-items: center; gap: 8px; }
.qty button { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); font-size: 18px; font-weight: 700; }
.qty span { min-width: 22px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
input[type="text"], input[type="tel"], input[type="number"], textarea { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: right; color: var(--mute); font-weight: 600; font-size: 12px; padding: 4px 6px; }
td { padding: 8px 6px; border-top: 1px solid var(--line); }
.scroll-x { overflow-x: auto; }
#toast { position: fixed; inset: auto 16px calc(84px + env(safe-area-inset-bottom, 0px)) 16px; z-index: 60; background: var(--ink); color: var(--bg); padding: 11px 14px; border-radius: 10px; text-align: center; font-weight: 600; max-width: 480px; margin: 0 auto; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

<div class="app" dir="rtl" lang="ar">
  <header>
    <div class="brand"><h1>جينا الشمالية</h1><small id="who"></small></div>
    <div class="seg" role="group" aria-label="الدور">
      <button type="button" data-a="role" data-v="rep" id="b-rep">مندوب</button>
      <button type="button" data-a="role" data-v="sup" id="b-sup">مشرف</button>
    </div>
    <div class="demo-note">نسخة تجريبية: الأسماء مخترعة ولا يُحفظ شيء في أي مكان.</div>
  </header>
  <main id="view"></main>
  <nav><div class="in" id="nav"></div></nav>
</div>
<div id="sheet-root"></div>
<div id="toast" hidden></div>

<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var money = function (n) { return "$" + Math.round(n).toLocaleString("en-US"); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };

  var REASONS = ["المحل مغلق", "صاحب المحل غير موجود", "رفض الزيارة", "سبب آخر"];
  var TARGET = { visits: 8 };

  var S = {
    role: "rep", tab: { rep: "line", sup: "calls" },
    shops: [
      ["سوبرماركت النور", "الفرقان", 38], ["بقالة الأمين", "الأعظمية", 120], ["مول الشهباء", "حلب الجديدة", 64], ["ميني ماركت السلام", "صلاح الدين", 210],
      ["بقالة أبو خالد", "الميدان", 85], ["سوبرماركت الفردوس", "الفردوس", 150], ["محل الياسمين", "العزيزية", 47], ["بقالة الرحمة", "الجميلية", 99]
    ].map(function (a, i) { return { id: i + 1, name: a[0], area: a[1], dist: a[2], st: "todo", reason: "" }; }),
    sheet: null,
    calls: [
      { id: 1, shop: "بقالة السعادة", rep: "إبراهيم علوش", phone: "0944 000 111", date: "أمس", res: "pending", note: "" },
      { id: 2, shop: "سوبرماركت القمر", rep: "محمد قرموطة", phone: "0955 000 222", date: "أمس", res: "pending", note: "" },
      { id: 3, shop: "محل الأصيل", rep: "محمد مكتبي", phone: "0933 000 333", date: "أمس", res: "pending", note: "" },
      { id: 4, shop: "بقالة الندى", rep: "إبراهيم علوش", phone: "0966 000 444", date: "أمس", res: "pending", note: "" },
      { id: 5, shop: "ميني ماركت الورد", rep: "محمد قرموطة", phone: "0944 000 555", date: "أمس", res: "pending", note: "" },
      { id: 6, shop: "مول الأمل", rep: "معتز هنو", phone: "0988 000 666", date: "أمس", res: "pending", note: "" }
    ],
    confirmFake: null, noteFor: null,
    audits: [], aud: null
  };
  var NEARBY = [["سوبرماركت الزهراء", 55], ["بقالة العروبة", 130], ["محل الشام", 190]];

  function toast(t) { var e = $("#toast"); e.textContent = t; e.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { e.hidden = true; }, 2200); }

  function repCount() {
    var done = S.shops.filter(function (x) { return x.st === "visited"; }).length;
    var miss = S.shops.filter(function (x) { return x.st === "nosale"; }).length;
    return { done: done, miss: miss, left: S.shops.length - done - miss };
  }

  /* ---------- rep views ---------- */
  function repLine() {
    var r = repCount();
    var h = '<div class="card"><div class="row"><h2>خط اليوم</h2><span class="chip acc num">' + r.done + " من " + TARGET.visits + '</span></div>' +
      '<div class="bar"><i style="width:' + Math.round(r.done / TARGET.visits * 100) + '%"></i></div>' +
      '<div class="mute">مندوب تجريبي: محمد قرموطة · مفرق · الأربعاء</div></div><div class="list">';
    S.shops.forEach(function (s) {
      var chip = s.st === "visited" ? '<span class="chip ok">تمت الزيارة</span>' : s.st === "nosale" ? '<span class="chip warn">' + esc(s.reason) + "</span>" : '<span class="chip">لم تُزر</span>';
      h += '<button type="button" class="item" data-a="open" data-v="' + s.id + '"' + (s.st !== "todo" ? " disabled" : "") + "><span><b>" + esc(s.name) + '</b><span class="mute">' + esc(s.area) + "</span></span>" + chip + "</button>";
    });
    return h + "</div>";
  }
  function repSummary() {
    var r = repCount();
    return '<div class="card"><h2>ملخص اليوم</h2></div>' +
      '<div class="tiles"><div class="tile"><b>' + r.done + '</b><span>تمت زيارتها</span></div><div class="tile"><b>' + r.miss + '</b><span>لم تتم</span></div><div class="tile"><b>' + r.left + "</b><span>متبقية</span></div></div>";
  }
  function repSheet() {
    var sh = S.sheet, s = S.shops.filter(function (x) { return x.id === sh.id; })[0];
    var h = '<div class="sheet-bg" data-a="closebg"><div class="sheet" role="dialog" aria-label="زيارة"><div class="row"><div><h2>' + esc(s.name) + '</h2><div class="mute">' + esc(s.area) + '</div></div><button type="button" class="chip" data-a="close">إغلاق</button></div>' +
      '<div class="step"><span class="mute">الموقع (تجريبي)</span><span class="chip ok">على بعد ' + s.dist + " م · الدقة 12 م</span></div>";
    if (sh.step === "result") {
      h += '<div class="grid2"><button type="button" class="opt" data-a="visited">تمت الزيارة</button><button type="button" class="opt" data-a="nosale">لم تتم</button></div>';
    } else {
      h += "<h3>السبب</h3><div class=\"list\">";
      REASONS.forEach(function (r) { h += '<button type="button" class="opt" data-a="reason" data-v="' + esc(r) + '">' + esc(r) + "</button>"; });
      h += "</div>";
    }
    return h + "</div></div>";
  }

  /* ---------- supervisor views ---------- */
  function supCalls() {
    var done = S.calls.filter(function (c) { return c.res !== "pending"; }).length, pend = S.calls.filter(function (c) { return c.res === "pending"; });
    var h = '<div class="card"><div class="row"><h2>اتصالات اليوم</h2><span class="chip acc num">' + done + " من " + S.calls.length + '</span></div><div class="bar"><i style="width:' + Math.round(done / S.calls.length * 100) + '%"></i></div><div class="mute">محلات زارها المندوبون أمس بلا فاتورة. اسأل: هل زاره المندوب وهل اشترى؟</div></div>';
    if (S.noteFor) {
      var nc = S.calls.filter(function (c) { return c.id === S.noteFor; })[0];
      return h + '<div class="card"><h3>ملاحظة عن ' + esc(nc.shop) + '</h3><label class="mute" for="note">ماذا قال الزبون؟</label><textarea id="note" rows="3"></textarea><div class="grid2"><button type="button" class="btn" data-a="savenote">حفظ</button><button type="button" class="btn ghost" data-a="skipnote">تخطي</button></div></div>';
    }
    if (!pend.length) return h + '<div class="card"><b>انتهت اتصالات اليوم.</b><span class="mute">يظهر ملخصها في تبويب الملخص.</span></div>';
    var c = pend[0];
    if (S.confirmFake === c.id) {
      return h + '<div class="card"><h3>تأكيد</h3><b>هل نفى الزبون أن المندوب زاره؟</b><span class="mute">سيصل إشعار فوري للإدارة </span><button type="button" class="btn bad" data-a="fakeyes">نعم، أكّد</button><button type="button" class="btn ghost" data-a="fakeno">رجوع</button></div>';
    }
    return h + '<div class="card"><div class="row"><h2>' + esc(c.shop) + '</h2><span class="chip">' + esc(c.date) + '</span></div><div class="mute">المندوب: ' + esc(c.rep) + '</div><div class="row"><span class="mute">الهاتف</span><b class="num" dir="ltr">' + esc(c.phone) + '</b></div>' +
      '<div class="grid2"><button type="button" class="opt" data-a="call" data-v="ok">تم</button><button type="button" class="opt" data-a="call" data-v="no_answer">لم يرد</button><button type="button" class="opt" data-a="call" data-v="weak">ضعيفة</button><button type="button" class="opt" data-a="call" data-v="postponed">لاحقاً</button></div>' +
      '<button type="button" class="btn bad" data-a="call" data-v="fake">وهمية: نفى الزيارة</button></div>';
  }
  var Q = [["rv", "هل زاره المندوب فعلاً؟"], ["ow", "هل صاحب المحل راضٍ عن التعامل؟"], ["pr", "هل الأسعار مطابقة؟"], ["st", "هل المخزون كافٍ؟"]];
  function supAudit() {
    var a = S.aud, h = "";
    if (!a) {
      h = '<div class="card"><h2>زيارة تدقيق</h2><div class="mute">يحدد التطبيق أقرب المحلات المسجّلة من موقعك.</div><button type="button" class="btn" data-a="auditstart">ابدأ بإرسال موقعي (تجريبي)</button></div>';
      if (S.audits.length) {
        h += "<h3>زيارات اليوم</h3><div class=\"list\">";
        S.audits.forEach(function (x) { h += '<div class="item"><span><b>' + esc(x.name) + '</b><span class="mute num">' + x.score + " / 10</span></span><span class=\"chip " + (x.prio === "عاجل" ? "bad" : x.prio === "منخفض" ? "ok" : "acc") + '">' + x.prio + "</span></div>"; });
        h += "</div>";
      }
      return h;
    }
    if (a.step === "pick") {
      h = '<div class="card"><h2>اختر المحل</h2><div class="mute">أقرب المحلات المسجّلة (ضمن 250 م)</div></div><div class="list">';
      NEARBY.forEach(function (n, i) { h += '<button type="button" class="item" data-a="pickstore" data-v="' + i + '"><b>' + esc(n[0]) + '</b><span class="chip">' + n[1] + " م</span></button>"; });
      return h + '<button type="button" class="item" data-a="unreg"><b>محل غير مسجّل</b><span class="chip warn">إضافة</span></button></div>';
    }
    var qi = Q.map(function (q) { return q[0]; }).indexOf(a.step);
    if (qi >= 0) {
      return '<div class="card"><div class="mute">' + esc(a.name) + " · سؤال " + (qi + 1) + " من 4</div><h2>" + Q[qi][1] + '</h2><div class="grid3"><button type="button" class="opt" data-a="ans" data-v="y">نعم</button><button type="button" class="opt" data-a="ans" data-v="n">لا</button><button type="button" class="opt" data-a="ans" data-v="x">لا أعرف</button></div></div>';
    }
    if (a.step === "score") {
      var g = ""; for (var i = 0; i <= 10; i++) g += '<button type="button" class="opt num" data-a="score" data-v="' + i + '">' + i + "</button>";
      return '<div class="card"><div class="mute">' + esc(a.name) + "</div><h2>قيّم المحل من 0 إلى 10</h2><div class=\"grid6\">" + g + "</div></div>";
    }
    if (a.step === "phone") {
      return '<div class="card"><h2>هاتف المحل</h2><label class="mute" for="ph">اكتب الرقم أو تخطَّ</label><input id="ph" type="tel" inputmode="tel" dir="ltr" placeholder="09xx xxx xxx"><div class="grid2"><button type="button" class="btn" data-a="phone">التالي</button><button type="button" class="btn ghost" data-a="phoneskip">تخطي</button></div><div class="mute">الصورة تبقى في تيليغرام ولا تُحفظ في قاعدة البيانات.</div></div>';
    }
    return '<div class="card"><h2>ملاحظة أخيرة</h2><label class="mute" for="an">اختياري</label><textarea id="an" rows="3"></textarea><button type="button" class="btn" data-a="finish">حفظ الزيارة</button></div>';
  }
  function supSummary() {
    var c = { ok: 0, no_answer: 0, weak: 0, fake: 0, postponed: 0 };
    S.calls.forEach(function (x) { if (c[x.res] != null) c[x.res]++; });
    var done = S.calls.filter(function (x) { return x.res !== "pending"; }).length;
    var avg = S.audits.length ? (S.audits.reduce(function (a, x) { return a + x.score; }, 0) / S.audits.length).toFixed(1) : "—";
    var notv = S.audits.filter(function (x) { return x.rv === "n"; }).length;
    var r = repCount();
    var rows = [["إبراهيم علوش", 14], ["محمد قرموطة (حي)", r.done], ["محمد مكتبي", 8], ["معتز هنو", 12]];
    var h = '<div class="card"><h2>ملخص اليوم</h2><div class="tiles"><div class="tile"><b>' + done + "/" + S.calls.length + "</b><span>اتصالات</span></div><div class=\"tile\"><b>" + S.audits.length + "</b><span>تدقيق</span></div><div class=\"tile\"><b class=\"num\">" + avg + "</b><span>متوسط التقييم</span></div></div>" +
      '<div><span class="chip ok">تم ' + c.ok + '</span> <span class="chip">لم يرد ' + c.no_answer + '</span> <span class="chip warn">ضعيفة ' + c.weak + '</span> <span class="chip bad">وهمية ' + c.fake + '</span> <span class="chip acc">لاحقاً ' + c.postponed + "</span></div>" +
      (notv ? '<div class="chip bad">مندوب لم يزر المحل: ' + notv + "</div>" : "") + "</div>" +
      '<div class="card"><h3>زيارات المناديب اليوم</h3><div class="scroll-x"><table><thead><tr><th>المندوب</th><th>الزيارات</th></tr></thead><tbody>';
    rows.forEach(function (x) { h += "<tr><td>" + esc(x[0]) + '</td><td class="num">' + x[1] + "</td></tr>"; });
    return h + "</tbody></table></div></div>" + (c.fake ? '<div class="card"><b class="chip bad" style="justify-self:start">إشعار أُرسل للإدارة</b><span class="mute">زيارة وهمية مكتشفة اليوم: ' + c.fake + "</span></div>" : "");
  }

  /* ---------- shell ---------- */
  var NAV = { rep: [["line", "خط اليوم"], ["sum", "ملخصي"]], sup: [["calls", "الاتصالات"], ["audit", "التدقيق"], ["sum", "الملخص"]] };
  function render() {
    $("#b-rep").setAttribute("aria-pressed", S.role === "rep"); $("#b-sup").setAttribute("aria-pressed", S.role === "sup");
    $("#who").textContent = S.role === "rep" ? "محمد قرموطة · مندوب" : "عبد الحميد كنجو · مشرف";
    var t = S.tab[S.role], v;
    if (S.role === "rep") v = t === "line" ? repLine() : repSummary();
    else v = t === "calls" ? supCalls() : t === "audit" ? supAudit() : supSummary();
    $("#view").innerHTML = v;
    $("#nav").innerHTML = NAV[S.role].map(function (n) { return '<button type="button" data-a="tab" data-v="' + n[0] + '"' + (n[0] === t ? ' aria-current="page"' : "") + ">" + n[1] + "</button>"; }).join("");
    $("#sheet-root").innerHTML = S.sheet ? repSheet() : "";
  }

  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-a]"); if (!el) return;
    var a = el.getAttribute("data-a"), v = el.getAttribute("data-v"), sh = S.sheet;
    if (a === "closebg") { if (e.target !== el) return; S.sheet = null; return render(); }
    if (a === "close") { S.sheet = null; return render(); }
    if (a === "role") { S.role = v; S.sheet = null; return render(); }
    if (a === "tab") { S.tab[S.role] = v; return render(); }
    /* rep */
    if (a === "open") { S.sheet = { id: +v, step: "result" }; return render(); }
    if (a === "visited") { var s0 = S.shops.filter(function (x) { return x.id === sh.id; })[0]; s0.st = "visited"; S.sheet = null; toast("سُجّلت الزيارة"); return render(); }
    if (a === "nosale") { sh.step = "reason"; return render(); }
    if (a === "reason") { var s1 = S.shops.filter(function (x) { return x.id === sh.id; })[0]; s1.st = "nosale"; s1.reason = v; S.sheet = null; toast("سُجّل: " + v); return render(); }
    /* supervisor calls */
    if (a === "call") {
      var pend = S.calls.filter(function (c) { return c.res === "pending"; })[0]; if (!pend) return;
      if (v === "fake") { S.confirmFake = pend.id; return render(); }
      pend.res = v; if (v === "weak") S.noteFor = pend.id; toast("سُجّلت النتيجة"); return render();
    }
    if (a === "fakeno") { S.confirmFake = null; return render(); }
    if (a === "fakeyes") { var c1 = S.calls.filter(function (c) { return c.id === S.confirmFake; })[0]; c1.res = "fake"; S.confirmFake = null; S.noteFor = c1.id; toast("سُجّلت زيارة وهمية وأُبلغت الإدارة"); return render(); }
    if (a === "savenote") { var c2 = S.calls.filter(function (c) { return c.id === S.noteFor; })[0]; c2.note = ($("#note") || {}).value || ""; S.noteFor = null; toast("حُفظت الملاحظة"); return render(); }
    if (a === "skipnote") { S.noteFor = null; return render(); }
    /* audit */
    if (a === "auditstart") { S.aud = { step: "pick", name: "", d: {} }; return render(); }
    if (a === "pickstore") { S.aud.name = NEARBY[+v][0]; S.aud.step = "rv"; return render(); }
    if (a === "unreg") { S.aud.name = "محل غير مسجّل"; S.aud.step = "rv"; return render(); }
    if (a === "ans") { var key = S.aud.step; S.aud.d[key] = v; var nx = { rv: "ow", ow: "pr", pr: "st", st: "score" }[key]; S.aud.step = nx; return render(); }
    if (a === "score") { S.aud.d.score = +v; S.aud.step = "phone"; return render(); }
    if (a === "phone" || a === "phoneskip") { S.aud.step = "note"; return render(); }
    if (a === "finish") {
      var d = S.aud.d, prio = d.rv === "n" ? "عاجل" : d.score >= 8 ? "منخفض" : "عادي";
      S.audits.push({ name: S.aud.name, score: d.score, prio: prio, rv: d.rv }); S.aud = null; toast("سُجّلت زيارة التدقيق"); return render();
    }
  });
  render();
})();
</script>
