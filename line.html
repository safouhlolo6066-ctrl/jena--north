    L.forEach(function (s) { var x = S[s.r] || {}; if (vis(s)) v++; if (buy(s)) b++; if (x.visited === '0') nv++; });
    $('sum').innerHTML = '<span><b>' + v + '<small style="font-size:.6em;color:var(--sub)">/' + n + '</small></b>انزار</span><span><b>' + b + '</b>تم بيع</span><span><b>' + (n - v - nv) + '</b>باقي</span>';
    $('bar').style.width = (n ? Math.round(v * 100 / n) : 0) + '%';
  }
  function card(s, i) {
    var x = S[s.r] || {}, v = vis(s), b = buy(s), no = x.visited === '0', nb = v && x.bought === '0';
    var cls = v ? (b ? ' ok' : (nb ? ' nb' : ' vis')) : (no ? ' nv' : (s.m ? ' miss' : ''));
    var ph = x.phone || s.p || '';
    var h = '<div class="c' + cls + '" id="c' + esc(s.r) + '"><div class="hd"><span class="n">' + (i + 1) + '</span><div class="tt"><div class="nm">' + esc(s.n) + '</div><div class="mt">'
      + 'رقم ' + esc(s.g || '—') + (ph && !/^x+$/i.test(ph) ? ' · <a href="tel:' + esc(ph.split('/')[0].trim()) + '">☎ ' + esc(ph) + '</a>' : ' · ☎ —') + '</div></div><div class="chips">'
      + (v && (x.vt || s.pv) ? '<span class="tm' + (x.off ? ' ofl' : '') + '">🕒 ' + esc(x.vt || 'بالملف') + (x.off ? ' 📴' : '') + '</span>' : '')
      + (x.lat ? '<a class="tm lc" target="_blank" href="https://maps.google.com/?q=' + esc(x.lat) + ',' + esc(x.lng) + '">📍 الزيارة</a>' : (s.sl ? '<a class="tm lc" target="_blank" href="https://maps.google.com/?q=' + esc(s.sl) + '">📍 المحل</a>' : ''))
      + '</div></div>';
    if (s.t || s.a) h += '<div class="goal">' + [s.t, s.a ? '💡 ' + esc(String(s.a).replace(/💡 /g, '')).split('\n').join('<br>💡 ') : ''].filter(Boolean).join('<br>') + '</div>';
    if (s.s) h += '<div class="st">' + esc(s.s) + '</div>';
    if (s.m && !v) h += '<div class="mm">🔴 ما انزار المرة الماضية — خليه أولوية اليوم</div>';
    var r = esc(s.r);
    h += '<div class="row"><button data-a="v1" data-r="' + r + '" class="' + (v ? 'on g' : '') + '">✅ انزار</button><button data-a="v0" data-r="' + r + '" class="' + (no ? 'on r' : '') + '">⭕ لم يتم زيارته</button></div>';
    if (v) {
      h += '<div class="row"><button data-a="b1" data-r="' + r + '" class="' + (b ? 'on g' : '') + '">💰 تم بيع</button><button data-a="b0" data-r="' + r + '" class="' + (nb ? 'on a' : '') + '">✖️ لم يتم بيعه</button></div>';
      if (nb) h += '<select aria-label="سبب عدم البيع" data-r="' + r + '"><option value="">— سبب عدم البيع —</option>' + (D.reasons || []).map(function (o) { return '<option' + (o === x.reason ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>';
    }
    h += '<textarea data-r="' + r + '" rows="1" placeholder="📝 ملاحظات (اختياري)">' + esc(x.note || '') + '</textarea>';
    h += '<div class="ft"><span class="sv" id="sv' + r + '"></span><span>'
      + (x.lat ? '' : '<button class="lk gl" data-a="gl" data-r="' + r + '">📍 سجّل موقع المحل</button> · ')
      + '<button class="lk ph" data-a="ph" data-r="' + r + '">☎ ' + (x.phone ? 'عدّل الرقم' : 'أضف رقم') + '</button></span></div></div>';
    return h;
  }
  function visible(s) { var x = S[s.r] || {}; if (q && norm(s.n + ' ' + s.g + ' ' + s.p + ' ' + (x.phone || '')).indexOf(q) < 0) return false;
    if (filt === 'left') return !vis(s) && x.visited !== '0'; if (filt === 'vis') return vis(s); if (filt === 'nv') return x.visited === '0'; return true; }
  function render() {
    var L = shops(), k = 0;
    $('list').innerHTML = L.map(function (s) { var c = visible(s) ? card(s, k) : ''; k++; return c; }).join('') || '<p class="emp">' + (q ? 'ما لقيت محل 🔍' : (L.length ? 'ما في محلات بهالفلتر 👌' : 'ما في محلات بهاليوم 🌿')) + '</p>';
    $('tools').style.display = (D.advice || ROSTER) ? 'flex' : 'none';
    summary(L);
    if (VIEW) document.querySelectorAll('#list button,#list select,#list textarea').forEach(function (e) { if (e.tagName !== 'A') e.disabled = true; });
  }
  function head() {
    $('h1').textContent = '🧭 خط اليوم — ' + D.rep;
    $('sub').textContent = String(D.dateTxt || D.day || '') + ' · ' + D.tab + (MODE === 'test' ? ' · 🧪 تجربة' : '') + (ROSTER ? ' · ▾ يوم تاني' : '');
    D.advice = '💡 <b>ملخص الخط</b><br>• 🎯 هدف الخط الشهري: $' + (D.target_month || 0) + '<br>• 🏪 محلات اليوم: ' + (D.shops || []).length + (D.cycle_set ? '' : '<br>• ⚠️ ما انحدد أسبوع الدوام (1 أو 2) — الأسبوع الحالي تقديري.');
    $('advbtn').style.display = 'inline-block';
    $('backbtn').style.display = ROSTER ? 'inline-block' : 'none';
    var vw = $('view');
    if (VIEW) { vw.style.display = 'block'; vw.innerHTML = '👁 نسختك للمشاهدة بس — المندوب هو يلي بيسجّل.' + (ME && /^(admin|gm)$/.test(ME.role) ? ' <button id="testbtn" style="border:0;background:var(--blue);color:#fff;border-radius:999px;padding:3px 12px;font:inherit;font-weight:700">🧪 جرّب</button>' : ''); }
    else if (MODE === 'test') { vw.style.display = 'block'; vw.innerHTML = '🧪 وضع تجربة — اللي بتسجّلو هون ما بينحسب بتقارير المندوب. <button id="testbtn" style="border:0;background:var(--blue);color:#fff;border-radius:999px;padding:3px 12px;font:inherit;font-weight:700">👁 مشاهدة</button>'; }
    else vw.style.display = 'none';
  }

  // ── events
  document.addEventListener('click', function (ev) {
    var t = ev.target;
    if (t.id === 'locbtn') { try { if (TG && TG.LocationManager && TG.LocationManager.isInited && !TG.LocationManager.isAccessGranted) TG.LocationManager.openSettings(); else refreshLoc(); } catch (e) { gps(); } return; }
    if (t.id === 'advbtn') { var a = $('adv'); a.innerHTML = D.advice || ''; a.style.display = a.style.display === 'block' ? 'none' : 'block'; return; }
    if (t.id === 'backbtn') { location.href = 'index.html'; return; }
    if (t.id === 'testbtn') { var u = new URLSearchParams(location.search); if (MODE === 'test') u.delete('test'); else u.set('test', '1'); location.search = u.toString(); return; }
    if (t.id === 'sub' && ROSTER && D) { pick('📅 أي يوم من الخط؟', (D.tabs || []).map(function (x) { return { label: x, val: x }; }), function (k) { var u = new URLSearchParams(location.search); u.set('key', k); location.search = u.toString(); }); return; }
    var f = t.closest && t.closest('.f'); if (f) { filt = f.getAttribute('data-f'); document.querySelectorAll('.f').forEach(function (z) { z.classList.toggle('on', z === f); }); render(); return; }
    if (!D || VIEW) return;
    var b = t.closest && t.closest('button[data-a]'); if (!b) return;
    var r1 = b.getAttribute('data-r'), x = st(r1), a2 = b.getAttribute('data-a');
    if (a2 === 'v1') { if (x.visited === '1') return; push(r1, stampLoc(r1, { visited: '1', vt: hm(Date.now()) })); if (!fresh()) refreshLoc(function () { if (fresh() && !st(r1).lat) { push(r1, stampLoc(r1, {})); } else if (!st(r1).lat) { var nn = st(r1).note || ''; if (nn.indexOf('🚫 رفض الموقع') < 0) push(r1, { note: (nn ? nn + ' · ' : '') + '🚫 رفض الموقع' }); msg('📍 الموقع مقفل — فعّله من إعدادات تلغرام أو الموبايل (زر «فعّل» فوق) مشان ينسجّل مكان كل زيارة.'); setTimeout(function () { msg(''); }, 9000); } render(); }); }
    if (a2 === 'v0') push(r1, { visited: x.visited === '0' ? '' : '0', bought: '', reason: '' });
    if (a2 === 'b1') push(r1, { bought: x.bought === '1' ? '' : '1', reason: '' });
    if (a2 === 'b0') push(r1, { bought: x.bought === '0' ? '' : '0' });
    if (a2 === 'gl') { var e0 = $('sv' + r1); if (e0) e0.textContent = '⏳ عم ياخد الموقع…'; refreshLoc(function () { if (fresh()) { push(r1, stampLoc(r1, {})); render(); var e1 = $('sv' + r1); if (e1) e1.textContent = '✓ انحفظ موقع المحل'; } else { var e2 = $('sv' + r1); if (e2) e2.textContent = '⚠️ ما قدرت آخد الموقع — فعّل الموقع'; } }); return; }
    if (a2 === 'ph') { ask('☎ رقم الهاتف', [{ ph: '09xxxxxxxx', val: x.phone || '', type: 'tel' }], 'احفظ', function (v) { var np = v[0].replace(/[^\d+]/g, ''); if (np && np.length < 6) return; push(r1, { phone: np }); render(); }); return; }
    render(); var e3 = $('sv' + r1); if (e3) e3.textContent = navigator.onLine ? '✓ انحفظ' : '✓ انحفظ عالموبايل — بينبعت لما يرجع النت';
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target; if (!t.getAttribute || !t.getAttribute('data-r') || !D || VIEW) return;
    var r = t.getAttribute('data-r');
    if (t.tagName === 'SELECT') push(r, { reason: t.value }); else if (t.tagName === 'TEXTAREA') push(r, { note: t.value }); else return;
    var e = $('sv' + r); if (e) e.textContent = '✓ انحفظ';
  });
  document.addEventListener('input', function (ev) { var t = ev.target; if (t.id === 'q') { q = norm(t.value); render(); } else if (t.tagName === 'TEXTAREA') { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; } });

  // ── start
  function boot(j) {
    var pend = Q.slice();
    D = j.ses; MODE = j.mode; VIEW = MODE === 'view'; S = {};
    (D.visits || []).forEach(function (v) { S[v.r] = v; });
    pend.forEach(function (o) { var x = st(o.r); for (var k in o) { if (k !== 'id' && k !== 'ts' && k !== 'r') x[k] = o[k]; } });
    store(); head(); render(); net(); sync();
  }
  (async function () {
    locState = 'بعد أول زيارة'; showLoc();
    var cached = restore();
    if (cached) { head(); render(); net(); }
    try {
      if (!(await login())) return;
      var u = (await sb.auth.getUser()).data.user;
      var p = await sb.from('profiles').select('id,name,role,status').eq('id', u.id).maybeSingle(); ME = p.data;
      if (!ME || ME.status !== 'active') { msg('⚠️ حسابك غير مفعّل — تواصل مع الإدارة.'); return; }
      if (!/^rep/.test(ME.role) && !ROSTER) { location.replace('index.html'); return; }
      var r = await sb.rpc('app_line_load', { p_roster: ROSTER || null, p_key: KEY || null, p_test: TEST });
      if (r.error || !r.data || !r.data.ok) { if (!cached) msg(/no line/.test(r.error && r.error.message || '') ? '⚠️ ما في خط مربوط بحسابك — خبّر الإدارة.' : '⚠️ ما قدرت حمّل الخط — جرّب كمان شوي.'); return; }
      boot(r.data); msg('');
    } catch (e) { if (!cached) msg('📴 ما في نت — افتح الخط مرة وحدة وانت متصل، وبعدها بيشتغل أوفلاين.'); }
  })();
})();
</script>
